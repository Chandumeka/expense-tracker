{% extends "base.html" %}
{% block title %}My Profile - Expense Tracker{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7">

    <div class="d-flex align-items-center gap-3 mb-4">
      <div class="stat-icon balance-bg" style="font-size: 1.4rem;">
        {{ user.name[0]|upper }}
      </div>
      <div>
        <h4 class="fw-bold mb-0">{{ user.name }}</h4>
        <p class="text-muted mb-0">{{ user.email }}</p>
      </div>
    </div>

    <div class="panel-card">
      <h5 class="fw-bold mb-4"><i class="bi bi-person-gear me-2"></i>Edit Profile</h5>

      <form method="POST" action="{{ url_for('profile') }}">
        <div class="mb-3">
          <label class="form-label">Full Name</label>
          <input type="text" class="form-control" name="name" value="{{ user.name }}" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" name="email" value="{{ user.email }}" required>
        </div>

        <hr class="my-4" style="border-color: var(--border-color);">

        <div class="mb-3">
          <label class="form-label">New Password <span class="text-muted small">(leave blank to keep current)</span></label>
          <input type="password" class="form-control" name="new_password" minlength="6" placeholder="At least 6 characters">
        </div>

        <div class="mb-3">
          <label class="form-label">Confirm New Password</label>
          <input type="password" class="form-control" name="confirm_new_password" placeholder="Re-enter new password">
        </div>

        <hr class="my-4" style="border-color: var(--border-color);">

        <div class="mb-4">
          <label class="form-label">Current Password <span class="text-muted small">(required to save any change)</span></label>
          <input type="password" class="form-control" name="current_password" required placeholder="Confirm it's you">
        </div>

        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary-custom flex-fill">
            <i class="bi bi-check-lg me-1"></i> Save Changes
          </button>
          <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary flex-fill">Cancel</a>
        </div>
      </form>
    </div>

    <p class="text-muted text-center mt-3" style="font-size: 0.85rem;">
      <i class="bi bi-shield-lock me-1"></i>
      Member since {{ user.created_at.split(' ')[0] if user.created_at else '—' }}
    </p>

  </div>
</div>
{% endblock %}
