{% extends "base.html" %}
{% block title %}Edit Transaction - Expense Tracker{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="panel-card">
      <h4 class="fw-bold mb-4"><i class="bi bi-pencil-square me-2"></i>Edit Transaction</h4>

      <form method="POST" action="{{ url_for('edit_transaction', txn_id=txn.id) }}">
        <div class="mb-3">
          <label class="form-label">Type</label>
          <select class="form-select" name="type" required>
            <option value="expense" {% if txn.type == 'expense' %}selected{% endif %}>Expense</option>
            <option value="income" {% if txn.type == 'income' %}selected{% endif %}>Income</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label">Category</label>
          <select class="form-select" name="category" required>
            {% for cat in categories %}
              <option value="{{ cat }}" {% if cat == txn.category %}selected{% endif %}>{{ cat }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label">Amount (₹)</label>
          <input type="number" step="0.01" min="0.01" class="form-control" name="amount" value="{{ txn.amount }}" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Date</label>
          <input type="date" class="form-control" name="txn_date" value="{{ txn.txn_date }}" required>
        </div>

        <div class="mb-4">
          <label class="form-label">Note (optional)</label>
          <input type="text" class="form-control" name="note" value="{{ txn.note or '' }}">
        </div>

        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary-custom flex-fill">
            <i class="bi bi-check-lg me-1"></i> Update Transaction
          </button>
          <a href="{{ url_for('transactions') }}" class="btn btn-outline-secondary flex-fill">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
